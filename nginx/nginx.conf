events {}

http {
    server {
        listen 80;

        # Логиране (за задачата Logging)
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        # Healthcheck endpoint (за задачата Health checks)
        location /health {
            return 200 'Nginx is alive';
            add_header Content-Type text/plain;
        }

        # Маршрутизиране към App 1
        location /app1/ {
            proxy_pass http://app1_container:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Маршрутизиране към App 2
        location /app2/ {
            proxy_pass http://app2_container:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Начална страница
        location / {
            return 200 'Welcome to the Gateway! Go to /app1 or /app2';
            add_header Content-Type text/plain;
        }
    }
}
